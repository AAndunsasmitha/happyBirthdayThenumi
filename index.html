<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--plum:#2a1233;--plum2:#3d1b4a;--pink:#ff5d8f;--sun:#ffd166;--mint:#5fe3c0;--paper:#fff7ee;
--display:'Bagel Fat One','Arial Rounded MT Bold',system-ui,sans-serif;--body:'Outfit',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--plum);color:var(--paper);line-height:1.6;overflow-x:hidden}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* HERO */
.hero{min-height:100svh;display:grid;place-content:center;text-align:center;padding:2rem 1rem;position:relative;overflow:hidden;
background:radial-gradient(circle at 20% 20%,var(--plum2),transparent 55%),radial-gradient(circle at 85% 80%,#4b1f55,transparent 50%)}
.hero p.small{font-size:clamp(1rem,2.5vw,1.3rem);color:var(--sun);margin-bottom:.5rem}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(3rem,15vw,10rem);line-height:1;display:flex;flex-wrap:wrap;justify-content:center}
.hero h1 span{display:inline-block;opacity:0;transform:translateY(-120%) rotate(-12deg);animation:drop .9s cubic-bezier(.3,1.6,.5,1) forwards}
.hero h1 span:nth-child(3n){color:var(--pink)}.hero h1 span:nth-child(3n+1){color:var(--sun)}.hero h1 span:nth-child(3n+2){color:var(--mint)}
.hero h1 .gap{width:.35em}
@keyframes drop{to{opacity:1;transform:none}}
.hero .name{font-family:var(--display);font-size:clamp(1.8rem,7vw,3.6rem);margin-top:1rem;color:var(--paper);opacity:0;animation:fade 1s 1.6s forwards}
@keyframes fade{to{opacity:1}}
.btn{margin:2rem auto 0;font:600 1.1rem var(--body);background:var(--pink);color:#fff;border:0;border-radius:999px;padding:.9rem 2rem;cursor:pointer;
box-shadow:0 6px 0 #b8325f;transition:transform .15s,box-shadow .15s;opacity:0;animation:fade 1s 2.1s forwards}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b8325f}
.balloon{position:absolute;bottom:-160px;width:70px;height:88px;border-radius:50% 50% 48% 48%;animation:rise linear infinite;opacity:.85}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:60px;background:rgba(255,255,255,.4)}
@keyframes rise{to{transform:translateY(-130vh) translateX(var(--dx,30px)) rotate(8deg)}}

/* MARQUEE */
.marquee{background:var(--sun);color:var(--plum);font-family:var(--display);font-size:clamp(1.2rem,3vw,2rem);overflow:hidden;white-space:nowrap;padding:.6rem 0;transform:rotate(-1.2deg);margin:-1rem -2rem 0}
.marquee div{display:inline-block;animation:slide 25s linear infinite}
@keyframes slide{to{transform:translateX(-50%)}}

/* SECTIONS */
section{padding:5rem 1.2rem;max-width:1100px;margin:auto}
h2{font-family:var(--display);font-weight:400;font-size:clamp(2rem,6vw,3.5rem);margin-bottom:.6rem;color:var(--sun)}
.lead{max-width:60ch;font-size:1.15rem;opacity:.9;margin-bottom:2.5rem}

/* GALLERY */
.gallery{columns:3 240px;column-gap:1.4rem}
.polaroid{break-inside:avoid;margin:0 0 1.6rem;background:var(--paper);color:var(--plum);padding:.7rem .7rem 1rem;border-radius:4px;cursor:pointer;
box-shadow:0 10px 25px rgba(0,0,0,.35);transform:rotate(var(--r));transition:transform .3s cubic-bezier(.3,1.5,.5,1);border:0;display:block;width:100%;text-align:left;font:inherit}
.polaroid:nth-child(odd){--r:-2.2deg}.polaroid:nth-child(even){--r:1.8deg}.polaroid:nth-child(3n){--r:-.8deg}
.polaroid:hover,.polaroid:focus-visible{transform:rotate(0) scale(1.04);z-index:2;position:relative}
.polaroid .ph{width:100%;aspect-ratio:var(--ar,4/5);background:linear-gradient(135deg,var(--c1),var(--c2));display:grid;place-items:center;overflow:hidden;font-weight:600;color:#fff;text-align:center;font-size:.95rem;padding:.5rem}
.polaroid img{width:100%;height:100%;object-fit:cover;display:block}
.polaroid cite{display:block;font-family:var(--display);font-style:normal;font-size:1.05rem;margin-top:.6rem;text-align:center}

/* WISHES */
.wishes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.2rem}
.card{background:var(--plum2);border:2px dashed rgba(255,255,255,.25);border-radius:18px;padding:1.5rem;transition:transform .3s}
.card:hover{transform:translateY(-6px) rotate(-1deg);border-color:var(--mint)}
.card b{font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--mint);display:block;margin-bottom:.4rem}
.final{text-align:center}
.final p{font-family:var(--display);font-size:clamp(1.6rem,5vw,3rem);max-width:20ch;margin:0 auto 1.5rem}
.final .btn{opacity:1;animation:none}
footer{text-align:center;padding:2rem;opacity:.6;font-size:.9rem}

/* LIGHTBOX */
.lb{position:fixed;inset:0;background:rgba(20,6,26,.94);display:none;place-items:center;z-index:100;padding:1rem}
.lb.open{display:grid;animation:fade .25s forwards}
.lb figure{max-width:min(92vw,720px);text-align:center}
.lb .ph{width:min(86vw,520px);max-height:70vh;aspect-ratio:var(--ar,4/5);margin:auto;display:grid;place-items:center;border-radius:6px;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2))}
.lb img{width:100%;height:100%;object-fit:contain;background:#000}
.lb figcaption{font-family:var(--display);font-size:1.5rem;margin-top:1rem}
.lb button{position:absolute;background:var(--paper);color:var(--plum);border:0;border-radius:50%;width:48px;height:48px;font-size:1.5rem;cursor:pointer}
.lb .x{top:1rem;right:1rem}.lb .p{left:1rem;top:50%}.lb .n{right:1rem;top:50%}

@media (max-width:600px){.marquee{margin:-1rem -2rem 0}section{padding:3.5rem 1rem}.lb .p,.lb .n{top:auto;bottom:1.5rem}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.balloon{display:none}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<header class="hero" id="top">
  <p class="small" id="dateLine"></p>
  <h1 id="title" aria-label="Happy Birthday"></h1>
  <div class="name" id="friendName"></div>
  <button class="btn" id="party">Start the party</button>
</header>

<div class="marquee" aria-hidden="true"><div id="marq"></div></div>

<section id="memories">
  <h2>Favourite moments</h2>
  <p class="lead" id="intro"></p>
  <div class="gallery" id="gallery"></div>
</section>

<section id="wishes">
  <h2>Ten wishes for you</h2>
  <p class="lead">A few things I hope this year brings your way.</p>
  <div class="wishes" id="wishList"></div>
</section>

<section class="final">
  <p id="closing"></p>
  <button class="btn" id="party2">More confetti!</button>
</section>
<footer id="foot"></footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="x" aria-label="Close">&times;</button>
  <button class="p" aria-label="Previous photo">&lsaquo;</button>
  <button class="n" aria-label="Next photo">&rsaquo;</button>
  <figure><div class="ph" id="lbPh"></div><figcaption id="lbCap"></figcaption></figure>
</div>

<script>
/* ============ EDIT THIS PART ============ */
const CONFIG = {
  friendName: "Thenumiii",
  from: "911",
  birthday: "Today is your day",           // text shown above the title
  intro: "Ten photos, ten reasons I'm grateful to have you . Tap any photo to see it bigger.",
  closing: "It's been a long day without you, my friend.. And I'll tell you all about it when I see you again..",
  wishes: [
    "Laughter that hurts your cheeks","Adventures you'll talk about for years","Good health and lots of rest",
    "Dreams that finally come true","Great food with great people","Money in the bank and joy in the bag",
    "Peace on the hard days","New songs that become your favourites","Friends who always show up","A year even better than the last"
  ]
};
/* Put your photos in an "images" folder next to this file, then list them here.
   Example: { src: "images/photo1.jpg", caption: "Beach day" }
   If a photo can't be found, a colourful placeholder is shown instead. */
const PHOTOS = [
  {src:"images/photo1.jpeg", caption:"Oba sinasenna na danne..piyabanna sarasenne..ahankara balma kohendoo😂😂👂"},
  {src:"images/photo2.jpeg", caption:"Ahh nangiii!! (gemba 🐸)"},
  {src:"images/photo3.jpeg", caption:"mah baddiiee(1000/10)😎😁"},
  {src:"images/photo4.jpeg", caption:"Awrudu kumarii 😎🌞"},
  {src:"images/photo5.jpeg", caption:"Akkai Nangii?? 🤭"},
  {src:"images/photo6.jpeg", caption:"Okay, now give my shades back 😒"},
  {src:"images/photo7.jpeg", caption:"How can men be gay! 💅"},
  {src:"images/photo8.jpeg", caption:"Scuubaa!! Scuubaa!! 🤪🤪"},
  {src:"images/photo9.jpeg", caption:"Murukkuu/Paratha/Pasta 😵"},
  {src:"images/photo10.jpeg", caption:"That smile after successfully landing a hit on me 😑"}
];
/* ============ END EDIT ============ */

const $ = s => document.querySelector(s);
const colors = [["#ff5d8f","#ffa36b"],["#5fe3c0","#3b9bd9"],["#ffd166","#ff7b54"],["#a78bfa","#ff5d8f"],["#34d399","#fbbf24"]];
const ratios = ["4/5","1/1","3/4","5/4","4/5","1/1","3/4","4/5","5/4","1/1"];

// Hero title
const t = $("#title");
"Happy Birthday".split("").forEach((ch,i)=>{
  const s = document.createElement("span");
  if(ch===" "){s.className="gap";}else{s.textContent=ch;}
  s.style.animationDelay = (i*0.08)+"s";
  s.setAttribute("aria-hidden","true");
  t.appendChild(s);
});
$("#friendName").textContent = CONFIG.friendName;
$("#dateLine").textContent = CONFIG.birthday;
$("#intro").textContent = CONFIG.intro;
$("#closing").textContent = CONFIG.closing;
$("#foot").textContent = "Made with love by " + CONFIG.from;
document.title = "Happy Birthday " + CONFIG.friendName + "!";
$("#marq").textContent = ("Happy Birthday " + CONFIG.friendName + "  \u2605  ").repeat(12);

// Balloons
const hero = $("#top");
const bc = ["#ff5d8f","#ffd166","#5fe3c0","#a78bfa","#ff9f68"];
for(let i=0;i<9;i++){
  const b=document.createElement("div");b.className="balloon";b.setAttribute("aria-hidden","true");
  b.style.left=(5+i*11)+"%";b.style.background=bc[i%5];
  b.style.animationDuration=(9+Math.random()*8)+"s";b.style.animationDelay=(Math.random()*8)+"s";
  b.style.setProperty("--dx",(Math.random()*80-40)+"px");
  hero.appendChild(b);
}

// Gallery
const gal = $("#gallery");
function fillPh(el,p,i){
  el.innerHTML="";
  if(p.src && p.ok!==false){
    const img=new Image();img.alt=p.caption||("Photo "+(i+1));img.loading="lazy";
    img.onerror=()=>{p.ok=false;fillPh(el,p,i)};
    img.src=p.src;el.appendChild(img);
  }else{
    el.textContent="Photo "+(i+1);
  }
}
PHOTOS.forEach((p,i)=>{
  const c=colors[i%colors.length];
  const b=document.createElement("button");b.className="polaroid";
  b.style.setProperty("--c1",c[0]);b.style.setProperty("--c2",c[1]);b.style.setProperty("--ar",ratios[i]);
  b.setAttribute("aria-label","Open photo "+(i+1)+(p.caption?": "+p.caption:""));
  const ph=document.createElement("div");ph.className="ph";
  const cap=document.createElement("cite");cap.textContent=p.caption||"";
  b.append(ph,cap);fillPh(ph,p,i);
  b.addEventListener("click",()=>openLb(i));
  gal.appendChild(b);
  p.el=ph;p.ar=ratios[i];p.c=c;
});

// Wishes
CONFIG.wishes.forEach((w,i)=>{
  const d=document.createElement("div");d.className="card";
  d.innerHTML="<b></b><span></span>";
  d.firstChild.textContent="Wish "+(i+1);d.lastChild.textContent=w;
  $("#wishList").appendChild(d);
});

// Lightbox
const lb=$("#lb");let cur=0,lastFocus=null;
function showLb(){
  const p=PHOTOS[cur],box=$("#lbPh");
  box.style.setProperty("--c1",p.c[0]);box.style.setProperty("--c2",p.c[1]);box.style.setProperty("--ar",p.ar);
  fillPh(box,p,cur);$("#lbCap").textContent=p.caption||"";
}
function openLb(i){lastFocus=document.activeElement;cur=i;showLb();lb.classList.add("open");lb.querySelector(".x").focus()}
function closeLb(){lb.classList.remove("open");lastFocus&&lastFocus.focus()}
function step(d){cur=(cur+d+PHOTOS.length)%PHOTOS.length;showLb()}
lb.querySelector(".x").onclick=closeLb;
lb.querySelector(".p").onclick=()=>step(-1);
lb.querySelector(".n").onclick=()=>step(1);
lb.addEventListener("click",e=>{if(e.target===lb)closeLb()});
document.addEventListener("keydown",e=>{
  if(!lb.classList.contains("open"))return;
  if(e.key==="Escape")closeLb();if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1);
});
let sx=0;lb.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
lb.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)step(dx<0?1:-1)});

// Confetti
const cv=$("#confetti"),cx=cv.getContext("2d");let bits=[],raf=null;
function size(){cv.width=innerWidth;cv.height=innerHeight}
addEventListener("resize",size);size();
function burst(n=160,x=innerWidth/2,y=innerHeight/3){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const pal=["#ff5d8f","#ffd166","#5fe3c0","#a78bfa","#ffffff","#ff9f68"];
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=4+Math.random()*9;
    bits.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,w:6+Math.random()*7,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:pal[i%pal.length],life:140+Math.random()*60});
  }
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits=bits.filter(b=>b.life-->0&&b.y<cv.height+20);
  bits.forEach(b=>{b.vy+=.28;b.vx*=.99;b.x+=b.vx;b.y+=b.vy;b.r+=b.vr;
    cx.save();cx.translate(b.x,b.y);cx.rotate(b.r);cx.fillStyle=b.c;cx.globalAlpha=Math.min(1,b.life/40);cx.fillRect(-b.w/2,-b.h/2,b.w,b.h);cx.restore()});
  raf=bits.length?requestAnimationFrame(tick):null;
}
function party(){burst(180,innerWidth*.25,innerHeight*.4);burst(180,innerWidth*.75,innerHeight*.4)}
$("#party").onclick=()=>{party();$("#memories").scrollIntoView({behavior:"smooth"})};
$("#party2").onclick=party;
addEventListener("load",()=>setTimeout(party,1400));
document.addEventListener("pointerdown",e=>{if(e.target.closest("button")===null)burst(40,e.clientX,e.clientY)});
</script>
</body>
</html>
